<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HINATA - Aesthetic Space</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sacramento&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pillar: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f472b6',
                            400: '#ec4899',
                            500: '#d946ef',
                            600: '#c026d3',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        cursive: ['Sacramento', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf2f8;
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 10px;
        }
        
        .soft-shadow {
            box-shadow: 0 10px 30px -5px rgba(244, 114, 182, 0.2), 0 8px 10px -6px rgba(244, 114, 182, 0.1);
        }

        .script-title {
            font-family: 'Sacramento', cursive;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        @keyframes heartFall {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0.8);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
        .falling-heart {
            position: absolute;
            top: -30px;
            pointer-events: none;
            animation: heartFall linear forwards;
            filter: drop-shadow(0 2px 4px rgba(244, 114, 182, 0.3));
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-rose-100 to-pink-300 font-sans text-slate-700 min-h-screen flex flex-col justify-between selection:bg-pink-200 selection:text-pink-700 relative overflow-x-hidden">

    <!-- FALLING HEARTS CONTAINER -->
    <div id="heartsContainer" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <!-- TOP NAVBAR -->
    <header class="w-full bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-pink-100/80 px-4 md:px-8 py-3 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-pink-400 to-rose-300 p-0.5 shadow-md shadow-pink-200">
                    <img id="logoImg" src="https://i.ibb.co/YF16Dkz3/80bfdf431b98a82d3f925aa6ea3339d9.jpg" alt="Logo" class="w-full h-full object-cover rounded-full" onerror="this.src='https://placehold.co/100x100/fbcfe8/d946ef?text=LP'">
                </div>
                <span id="siteBrand" class="font-bold text-xs md:text-sm tracking-widest text-pink-400 uppercase">HINATA</span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-lg mx-2 md:mx-6">
                <div class="relative flex items-center w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-pink-300 text-sm"></i>
                    <input type="text" id="searchInput" onchange="handleSearch(this.value)" placeholder="Buscar en la galería..." class="w-full pl-10 pr-4 py-2 bg-pink-50/70 focus:bg-white text-xs md:text-sm text-pink-700 placeholder-pink-300 rounded-full border border-pink-100 focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="toggleLikePost()" id="headerLikeBtn" class="flex items-center gap-1.5 px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-white rounded-full text-xs font-semibold shadow-md shadow-pink-200 transition-all transform hover:scale-105 active:scale-95">
                    <i id="headerLikeIcon" class="fa-solid fa-heart"></i>
                    <span id="headerLikeText" class="hidden sm:inline">Me Gusta (1.2k)</span>
                </button>

                <button onclick="sharePage()" title="Compartir espacio" class="w-8 h-8 md:w-9 md:h-9 bg-pink-100 hover:bg-pink-200 text-pink-500 rounded-full flex items-center justify-center transition-all">
                    <i class="fa-solid fa-share-nodes text-xs md:text-sm"></i>
                </button>

                <button onclick="showToast('¡Sin notificaciones pendientes! ♡')" class="w-8 h-8 md:w-9 md:h-9 bg-pink-100 hover:bg-pink-200 text-pink-500 rounded-full flex items-center justify-center transition-all relative">
                    <i class="fa-solid fa-bell text-xs md:text-sm"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
                </button>

                <button onclick="toggleBookmark()" id="bookmarkBtn" title="Guardar en favoritos" class="w-8 h-8 md:w-9 md:h-9 bg-pink-100 hover:bg-pink-200 text-pink-500 rounded-full flex items-center justify-center transition-all">
                    <i id="bookmarkIcon" class="fa-regular fa-bookmark text-xs md:text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-8 flex-1 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8 items-start">
            
            <!-- LEFT COLUMN: Character Portrait Hero Card -->
            <div class="lg:col-span-5 w-full">
                <div class="relative w-full h-[520px] md:h-[620px] rounded-3xl overflow-hidden shadow-2xl shadow-pink-200/60 border-2 border-white/80 group">
                    <img id="heroImg" src="https://xatimg.com/image/TFPEEOBpwXgt.png" alt="Hero Portrait" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out" onerror="this.src='https://placehold.co/600x900/fbcfe8/ec4899?text=Mitsuri+Kanroji'">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-pink-950/60 via-transparent to-pink-500/10 pointer-events-none"></div>

                    <!-- Top Status Badge for Visitors -->
                    <div class="absolute top-4 right-4 bg-white/80 backdrop-blur-md px-3 py-1 rounded-full shadow-md border border-white/60 flex items-center gap-1.5 text-xs text-pink-600 font-semibold">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>Oficial</span>
                    </div>

                    <!-- Bottom Profile Pill Badge -->
                    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xs">
                        <div class="bg-white/90 backdrop-blur-md p-2 pl-3 rounded-full shadow-lg shadow-pink-900/20 border border-white flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span id="heroInitial" class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 font-bold flex items-center justify-center text-sm shadow-inner">
                                    M
                                </span>
                                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-400 to-rose-400 text-white flex items-center justify-center text-xs shadow-md shadow-pink-300/50">
                                    <i class="fa-solid fa-heart-pulse animate-pulse"></i>
                                </div>
                            </div>

                            <div class="flex-1 pr-3 text-right">
                                <span id="heroName" class="font-extrabold text-xs md:text-sm tracking-wider text-pink-600 uppercase block truncate">
                                    Lanita
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Main Post Card, Categories & Grid Widget -->
            <div class="lg:col-span-7 flex flex-col gap-6 md:gap-8 w-full">
                
                <!-- TOP CARD (FEATURED MAIN CARD) -->
                <div class="bg-white/90 backdrop-blur-md rounded-3xl p-5 md:p-6 shadow-xl shadow-pink-100/80 border border-pink-100/80 relative">
                    
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-pink-300 p-0.5 shadow-sm">
                                <img id="postAvatarImg" src="https://i.ibb.co/YF16Dkz3/80bfdf431b98a82d3f925aa6ea3339d9.jpg" alt="Avatar" class="w-full h-full object-cover rounded-full" onerror="this.src='https://placehold.co/100x100/fbcfe8/d946ef?text=LP'">
                            </div>
                            <div class="flex flex-col">
                                <div class="flex items-center gap-2">
                                    <span id="postAuthor" class="font-bold text-xs md:text-sm tracking-wider text-pink-500 uppercase">HINATA</span>
                                </div>
                                <span id="postSubtext" class="text-[10px] md:text-xs font-semibold text-pink-300 uppercase tracking-widest">
                                    HINATA • 7 MINUTES AGO
                                </span>
                            </div>
                        </div>

                        <button class="text-pink-300 hover:text-pink-500 transition-colors p-2">
                            <i class="fa-solid fa-bars text-base"></i>
                        </button>
                    </div>

                    <!-- Featured Image Box with Script Title Overlay -->
                    <div class="relative w-full h-64 md:h-80 rounded-2xl overflow-hidden mb-4 shadow-md group">
                        <img id="postMainImg" src="https://xatimg.com/image/Kumg7dATRgmy.jpg" alt="uwu Post" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/800x600/fbcfe8/ec4899?text=Love+Pillar'">
                        
                        <div class="absolute inset-0 bg-gradient-to-t from-pink-900/40 via-transparent to-transparent"></div>

                        <div class="absolute bottom-4 left-0 right-0 text-center">
                            <h2 id="postOverlayTitle" class="script-title text-4xl md:text-5xl text-white font-normal tracking-wide drop-shadow-md">
                                HINATA
                            </h2>
                        </div>
                    </div>

                    <p id="postCaptionText" class="text-xs md:text-sm text-pink-300/90 leading-relaxed font-medium text-center px-2">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Quis ipsum suspendisse ultrices gravida.
                    </p>
                </div>

                <!-- CATEGORY TABS NAVBAR -->
                <div class="flex items-center justify-around sm:justify-center gap-2 sm:gap-8 border-b border-pink-200/60 pb-3 px-2 overflow-x-auto">
                    <button onclick="setActiveTab(this, 'Nails')" class="tab-btn font-bold text-xs md:text-sm tracking-widest uppercase text-pink-300 hover:text-pink-500 transition-all py-1">
                        Nails
                    </button>
                    <button onclick="setActiveTab(this, 'ME')" class="tab-btn font-bold text-xs md:text-sm tracking-widest uppercase text-pink-300 hover:text-pink-500 transition-all py-1">
                        ME
                    </button>
                    <button id="defaultTabBtn" onclick="setActiveTab(this, 'AESTHETIC')" class="tab-btn font-bold text-xs md:text-sm tracking-widest uppercase text-pink-500 border-b-2 border-pink-400 pb-1 transition-all">
                        GALLERY
                    </button>
                    <button onclick="setActiveTab(this, 'MANGA')" class="tab-btn font-bold text-xs md:text-sm tracking-widest uppercase text-pink-300 hover:text-pink-500 transition-all py-1">
                        MANGA
                    </button>
                    <button onclick="setActiveTab(this, 'MORE')" class="tab-btn font-bold text-xs md:text-sm tracking-widest uppercase text-pink-300 hover:text-pink-500 transition-all py-1">
                        MORE
                    </button>
                </div>

                <!-- BOTTOM CARD (2x2 GALLERY GRID WITH TAB BADGE) -->
                <div class="relative bg-white/90 backdrop-blur-md rounded-3xl p-5 md:p-6 shadow-xl shadow-pink-100/80 border border-pink-100/80">
                    
                    <div class="absolute -left-4 top-1/2 -translate-y-1/2 z-10 hidden sm:flex">
                        <div class="w-10 h-10 rounded-full bg-white p-1 shadow-lg shadow-pink-300/40 border border-pink-100 flex items-center justify-center">
                            <div class="w-full h-full rounded-full bg-gradient-to-tr from-pink-400 to-rose-300 p-0.5">
                                <img id="gridTabImg" src="https://i.ibb.co/YF16Dkz3/80bfdf431b98a82d3f925aa6ea3339d9.jpg" alt="Tab Icon" class="w-full h-full object-cover rounded-full" onerror="this.src='https://placehold.co/100x100/fbcfe8/d946ef?text=LP'">
                            </div>
                        </div>
                    </div>

                    <!-- 2x2 Photos Grid -->
                    <div class="grid grid-cols-2 gap-3 md:gap-4">
                        <div class="h-28 sm:h-36 md:h-40 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all group relative">
                            <img id="gridImg1" src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500&auto=format&fit=crop" alt="Aesthetic Pink Hair" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute inset-0 bg-pink-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>

                        <div class="h-28 sm:h-36 md:h-40 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all group relative">
                            <img id="gridImg2" src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=500&auto=format&fit=crop" alt="Aesthetic Pink Makeup" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute inset-0 bg-pink-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>

                        <div class="h-28 sm:h-36 md:h-40 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all group relative">
                            <img id="gridImg3" src="https://images.unsplash.com/photo-1588516903720-8ceb67f9ef84?w=500&auto=format&fit=crop" alt="Aesthetic Glossy Lips" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute inset-0 bg-pink-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>

                        <div class="h-28 sm:h-36 md:h-40 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all group relative">
                            <img id="gridImg4" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop" alt="Aesthetic Ornament" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute inset-0 bg-pink-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-pink-300 font-medium">
        ♡ HINATA Aesthetic Space • Galería de Exhibición ♡
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-medium flex items-center gap-2 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <i class="fa-solid fa-heart text-pink-400"></i>
        <span id="toastMsg">Mensaje guardado</span>
    </div>

    <script>
        let currentTab = 'AESTHETIC';
        let isLiked = false;
        let likeCount = 1240;
        let isBookmarked = false;

        const categoriesData = {
            AESTHETIC: {
                postOverlayTitle: "HINATA",
                postMainImg: "https://xatimg.com/image/Kumg7dATRgmy.jpg",
                postCaptionText: "Espacio dedicado a la estética vibrante y dulce del Pilar del Amor, lleno de color, calidez y momentos mágicos.",
                gridImg1: "https://xatimg.com/image/962e7FEqWPxI.jpg",
                gridImg2: "https://xatimg.com/image/I39P1Z1ohPXw.jpg",
                gridImg3: "https://xatimg.com/image/Gp43wQFORWLP.jpg",
                gridImg4: "https://xatimg.com/image/mQyYH8ohBv3T.jpg",
                
            },
            Nails: {
                postOverlayTitle: "Nails gallery",
                postMainImg: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=800&auto=format&fit=crop",
                postCaptionText: "Ilustraciones digitales, fan arts originales y acuarelas inspiradas en el mundo de Demon Slayer.",
                gridImg1: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=500&auto=format&fit=crop",
                gridImg2: "https://images.unsplash.com/photo-1582562124811-c09040d0a901?w=500&auto=format&fit=crop",
                gridImg3: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&auto=format&fit=crop",
                gridImg4: "https://images.unsplash.com/photo-1578926375605-eaf7559b1458?w=500&auto=format&fit=crop"
            },
            ME: {
                postOverlayTitle: "anime cuts",
                postMainImg: "https://xatimg.com/image/uO5bBFWA5axl.gif",
                postCaptionText: "Escenas icónicas del anime, fotogramas de alta calidad y momentos de combate deslumbrantes.",
                gridImg1: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop",
                gridImg2: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop",
                gridImg3: "https://images.unsplash.com/photo-1563089145-599997674d42?w=500&auto=format&fit=crop",
                gridImg4: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop"
            },
            MANGA: {
                postOverlayTitle: "manga panels",
                postMainImg: "https://xatimg.com/image/CsOvb2jizlDd.jpg",
                postCaptionText: "Viñetas originales del manga, portadas de tomos oficiales y estética monocromática con toques rosados.",
                gridImg1: "https://xatimg.com/image/9EKtb3u3F4e0.jpg",
                gridImg2: "https://xatimg.com/image/ARnazvHZkECF.jpg",
                gridImg3: "https://xatimg.com/image/Yp7PeAsAOoBG.jpg",
                gridImg4: "https://xatimg.com/image/s5xBqVxjabd7.jpg"
            },
            MORE: {
                postOverlayTitle: "more vibes",
                postMainImg: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop",
                postCaptionText: "Fondos de pantalla adicionales, cosplays destacables, accesorios y sorpresas para todos los fans de Mitsuri.",
                gridImg1: "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500&auto=format&fit=crop",
                gridImg2: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=500&auto=format&fit=crop",
                gridImg3: "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=500&auto=format&fit=crop",
                gridImg4: "https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=500&auto=format&fit=crop"
            }
        };

        function applyTab(tab) {
            const catData = categoriesData[tab] || categoriesData['AESTHETIC'];
            
            document.getElementById('postOverlayTitle').textContent = catData.postOverlayTitle;
            document.getElementById('postMainImg').src = catData.postMainImg;
            document.getElementById('postCaptionText').textContent = catData.postCaptionText;

            document.getElementById('gridImg1').src = catData.gridImg1;
            document.getElementById('gridImg2').src = catData.gridImg2;
            document.getElementById('gridImg3').src = catData.gridImg3;
            document.getElementById('gridImg4').src = catData.gridImg4;
        }

        function setActiveTab(button, category) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.className = "tab-btn font-bold text-xs md:text-sm tracking-widest uppercase text-pink-300 hover:text-pink-500 transition-all py-1";
            });
            button.className = "tab-btn font-bold text-xs md:text-sm tracking-widest uppercase text-pink-500 border-b-2 border-pink-400 pb-1 transition-all";
            
            if (category) {
                currentTab = category;
                applyTab(currentTab);
                showToast(`Categoría: ${currentTab}`);
            }
        }

        function toggleLikePost() {
            isLiked = !isLiked;
            const btn = document.getElementById('headerLikeBtn');
            const text = document.getElementById('headerLikeText');
            
            if (isLiked) {
                likeCount++;
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-full text-xs font-semibold shadow-md shadow-pink-200 transition-all transform hover:scale-105 active:scale-95";
                text.textContent = `¡Te gusta! (${(likeCount/1000).toFixed(1)}k)`;
                showToast('¡Te ha gustado esta página! ♡');
            } else {
                likeCount--;
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-white rounded-full text-xs font-semibold shadow-md shadow-pink-200 transition-all transform hover:scale-105 active:scale-95";
                text.textContent = `Me Gusta (${(likeCount/1000).toFixed(1)}k)`;
                showToast('Me gusta eliminado');
            }
        }

        function toggleBookmark() {
            isBookmarked = !isBookmarked;
            const icon = document.getElementById('bookmarkIcon');
            if (isBookmarked) {
                icon.className = "fa-solid fa-bookmark text-xs md:text-sm text-pink-600";
                showToast('Añadido a tus guardados ♡');
            } else {
                icon.className = "fa-regular fa-bookmark text-xs md:text-sm";
                showToast('Removido de guardados');
            }
        }

        function sharePage() {
            showToast('¡Enlace listo para compartir! ♡');
        }

        function handleSearch(query) {
            if (query && query.trim() !== '') {
                showToast(`Buscando: "${query}"...`);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMsg');
            msg.textContent = message;
            
            toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
            }, 2200);
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyTab('AESTHETIC');
        });

        function spawnFallingHeart() {
            const container = document.getElementById('heartsContainer');
            if (!container) return;
            
            const heart = document.createElement('div');
            heart.className = 'falling-heart text-pink-400 select-none';
            
            const symbols = ['♥', '♡', '💖', '💗', '💕', '🌸', '✨'];
            heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            
            const startX = Math.random() * 100;
            const size = Math.random() * 1.4 + 0.8;
            const duration = Math.random() * 4 + 3;
            
            heart.style.left = startX + 'vw';
            heart.style.fontSize = size + 'rem';
            heart.style.animationDuration = duration + 's';
            
            container.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(spawnFallingHeart, 250);
    </script>
